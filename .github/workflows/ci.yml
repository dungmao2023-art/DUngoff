          ./scripts/fetch-dict-vi.ps1 -OutDir build/dict-vi-src *>&1 | Tee-Object report/windows-fetch-dict-vi.log
      - name: Đóng gói thư mục chạy được
        run: |
          $dict = if ("${{ steps.dictvi.outcome }}" -eq "success") { "build/dict-vi-src" } else { "" }
          ./scripts/package-windows.ps1 -BuildDir build/out -EngineDir build/lo/engine -QtDir $env:QT_ROOT_DIR -QpdfDir build/qpdf -OutDir build/dist -DictViDir $dict *>&1 | Tee-Object report/windows-package.log
      - name: Kiểm tra từ điển tiếng Việt tách riêng khỏi ứng dụng và engine
        run: |
          $app = "build/dist/DungOffice"
          $bad = @(Get-ChildItem $app -Recurse -File | Where-Object { $_.Name -match '^vi[_-].*\.(dic|aff)$|^vi\.(dic|aff)$' })
          if ($bad.Count) { $bad | ForEach-Object { Write-Host "::error::Từ điển vi lẫn trong thư mục ứng dụng: $($_.FullName)" }; exit 1 }
          Write-Host "Thư mục ứng dụng không chứa tệp từ điển tiếng Việt."
          if ("${{ steps.dictvi.outcome }}" -eq "success") {
            foreach ($n in "vi-DauMoi.dic","vi-DauMoi.aff","vi-DauCu.dic","GPL-2.0.txt","GPL-3.0.txt","NOTICE-vi.txt","README-en.txt") {
              if (-not (Test-Path "build/dist/dict-vi/$n")) { Write-Host "::error::Thiếu build/dist/dict-vi/$n"; exit 1 }
            }
            Write-Host "Thành phần từ điển (thư mục riêng build/dist/dict-vi) đủ tệp và giấy phép."
          } else { Write-Host "::warning::Không tải được từ điển; bộ cài sẽ không có thành phần này." }
          Get-Content build/dist/dict-vi-removed-from-engine.txt -ErrorAction SilentlyContinue
      - name: Ảnh chụp giao diện thật trên Windows
        if: steps.full.outcome == 'success'
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name, $argList) {
            $p = if ($argList) { Start-Process build/dist/DungOffice/DungOffice.exe -ArgumentList $argList -PassThru } `
                 else { Start-Process build/dist/DungOffice/DungOffice.exe -PassThru }
            Start-Sleep 30
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("report/windows-ui-$name.png")
            "$name : $(if ($p.HasExited) { "DIED exit=$($p.ExitCode)" } else { 'ALIVE' })" | Add-Content report/windows-ui.log
            if (-not $p.HasExited) { Stop-Process $p -Force }
            Start-Sleep 2
          }
          Shot "home" $null
          Shot "excel" "`"$PWD/fixtures/mau-doanh-thu.xlsx`""
          Shot "docx" "`"$PWD/fixtures/mau-van-ban.docx`""
          Shot "pdf" "`"$PWD/smoke/Tài liệu thử/ban-in.pdf`""
      - name: Bộ cài OneClick (Inno Setup) — chỉ khi mọi kiểm thử đã đạt
        if: success() && steps.full.outcome == 'success'
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          try { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Vietnamese.isl -OutFile installer/Vietnamese.isl } catch { Write-Host "Không tải được Vietnamese.isl, dùng tiếng Anh" }
          & $iscc /DSourceDir="$PWD\build\dist\DungOffice" /DDictDir="$PWD\build\dist\dict-vi" /DAppVersion="0.1.0" installer/DungOffice.iss *>&1 | Tee-Object report/windows-installer.log
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem installer/Output/*.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) } | Tee-Object -Append report/windows-installer.log
      - name: Tạo SHA256SUMS.txt cho các tệp phát hành (bộ cài, zip portable nếu có)
        if: success() && steps.full.outcome == 'success'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem installer/Output/* -Include *.exe,*.zip | ForEach-Object { $_.FullName })
          if (-not $files) { Write-Host "::error::Không có tệp phát hành để băm"; exit 1 }
          python scripts/make_sha256sums.py -o installer/Output/SHA256SUMS.txt @files *>&1 | Tee-Object report/windows-sha256sums.log
          if ($LASTEXITCODE) { exit 1 }
          # Kiểm lại bằng Get-FileHash (cách người dùng sẽ kiểm) — phải khớp từng dòng
          foreach ($l in Get-Content installer/Output/SHA256SUMS.txt) {
            $h, $n = $l -split '  ', 2
            $got = (Get-FileHash (Join-Path installer/Output $n) -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $h) { Write-Host "::error::Băm lệch: $n"; exit 1 }
          }
          Write-Host "SHA256SUMS: khớp Get-FileHash"
      - uses: actions/upload-artifact@v4
        if: success() && steps.full.outcome == 'success'
        with:
          name: DungOffice-Setup-x64
          path: |
            installer/Output/*.exe
            installer/Output/SHA256SUMS.txt
          retention-days: 14
      - name: Kiểm bộ cài đầu-cuối (cài im lặng, registry, lối tắt, chạy app đã cài, gỡ, đường dẫn có dấu)
        if: success() && steps.full.outcome == 'success'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer/Output/*.exe | Select-Object -First 1).FullName
          ./scripts/test-installer.ps1 -Setup $setup -DistApp "$PWD\build\dist\DungOffice" -DistDict "$PWD\build\dist\dict-vi" -Docx "$PWD\fixtures\mau-van-ban.docx" -Report "$PWD\report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-windows
          path: report/
      - name: Phát hành (chỉ khi gắn tag v*)
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && steps.full.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            installer/Output/*.exe
            installer/Output/*.zip
            installer/Output/SHA256SUMS.txt
          fail_on_unmatched_files: false
          prerelease: ${{ contains(inputs.release_tag != '' && inputs.release_tag || github.ref_name, '-') }}
          body: |
            Bản cài THỬ (chưa ký số, Windows SmartScreen sẽ cảnh báo). Kiểm SHA256 bằng SHA256SUMS.txt. Xem docs/HUONG_DAN_SU_DUNG.md và docs/KICH_BAN_KIEM_TRA_THIET_BI_THAT.md.

  # ------------------------------------------------------------------ Báo cáo: đẩy log + ảnh chụp lên nhánh ci-report
  report:
    if: always() && github.event_name != 'pull_request'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: report
      - name: Đẩy báo cáo lên nhánh ci-report
        run: |
          cd report
          {
            echo "# Báo cáo CI — ${GITHUB_SHA::8}"
            echo
            echo "- Linux: ${{ needs.linux.result }}"
            echo "- Windows: ${{ needs.windows.result }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > README.md
          git init -q -b ci-report
          git config user.name "dung-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI report ${GITHUB_SHA::8} (run ${{ github.run_id }})"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-report
          # Bản riêng theo nhánh, để các nhánh chạy song song không ghi đè báo cáo của nhau.
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-report-${GITHUB_REF_NAME//\//-}"
