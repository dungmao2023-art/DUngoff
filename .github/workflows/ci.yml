      - name: Từ điển Hunspell vi cho engine trên Windows — kiểm khối đăng ký (bắt buộc) + thăm dò gạch chân đỏ
        run: |
          $env:PYTHONUTF8 = "1"
          & build/out/dung-spelldicttest.exe *>&1 | Tee-Object report/windows-spelldicttest.log
          if ($LASTEXITCODE) { exit 1 }
          python tests/spell/make_spell_fixture.py spellfix
          $dictOk = $false
          try { ./scripts/fetch-dict-vi.ps1 -OutDir build/dict-vi-probe *>&1 | Tee-Object report/windows-spell-fetch.log; $dictOk = $true } catch { "Không tải được từ điển: $_" | Tee-Object -Append report/windows-spell-fetch.log }
          foreach ($f in @("spell-good","spell-bad")) {
            foreach ($mode in @("nodict","dict")) {
              if ($mode -eq "dict" -and -not $dictOk) { continue }
              $outf = "report/windows-spellprobe-$mode-$f.log"
              $args = @("$PWD/build/lo/engine/program", "$PWD/probe-spell-$mode-$f", "$PWD/spellfix/$f.docx")
