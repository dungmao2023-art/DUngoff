              $p = Start-Process build/out/dung-spellprobe.exe -PassThru -NoNewWindow -ArgumentList $args -RedirectStandardOutput $outf -RedirectStandardError "$outf.err"
              if (-not $p.WaitForExit(150000)) { Stop-Process $p -Force; "SPELL ${f}/${mode}: LỖI quá thời gian" | Add-Content $outf }
              Get-Content $outf | Select-String "^SPELL" | ForEach-Object { $_.Line }
            }
          }
          exit 0
