name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LO_VERSION: "26.8.3"
  ENGINE_TAG: "engine-26.8.3.1-headless"
  ENGINE_SHA256: "03261237878855c27013ff81ba03d766fd794ff49f88d711a013747f7325cac1"
  QT_VERSION: "6.8.3"

jobs:
  # ------------------------------------------------------------------ Linux: build nhanh + kiểm thử engine + ảnh chụp UI
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cài phụ thuộc (LibreOffice của Ubuntu, Qt 6, công cụ kiểm thử)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc libreoffice-writer libreoffice-impress libreoffice-draw \
            libreoffice-script-provider-python python3-uno \
            qt6-base-dev libgl-dev cmake ninja-build python3-openpyxl python3-pip \
            xvfb imagemagick fonts-dejavu fonts-noto-core x11-utils qpdf
          pip3 install --break-system-packages python-docx python-pptx
          mkdir -p report
          # Qt PDF cho xem trước/in: thử cài, ghi lại kết quả (không làm hỏng cả job nếu gói không có)
          if sudo apt-get install -y --no-install-recommends qt6-pdf-dev 2>&1 | tee report/linux-qtpdf-install.log | tail -2; then :; fi
          dpkg -s qt6-pdf-dev >/dev/null 2>&1 && echo "QTPDF=có" | tee -a report/linux-qtpdf-install.log || echo "QTPDF=không" | tee -a report/linux-qtpdf-install.log
      - name: Build
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee report/linux-configure.log
          cmake --build build 2>&1 | tee report/linux-build.log
      - name: Kiểm thử cầu nối script dung_api (danh sách trắng + engine thật, runMacro)
        run: |
          set -o pipefail
          python3 -I engine-build/dung-scripts/check_whitelist.py 2>&1 | tee report/linux-api-whitelist.log
          python3 -I engine-build/dung-scripts/test_dung_api_local.py 2>&1 | tee report/linux-api-pyuno.log
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --api 1 --out "$PWD/api-out" 2>&1 | tee report/linux-api-bridge.log
      - name: Kiểm thử công cụ PDF (qpdf)
        run: |
          set -o pipefail
          qpdf --version | head -1
          QT_QPA_PLATFORM=offscreen ./build/app/dung-pdftest 2>&1 | tee report/linux-pdftest.log
      - name: Kiểm thử tiện ích bảng tính (dòng trùng, so sánh, làm sạch)
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/app/dung-tabletest 2>&1 | tee report/linux-tabletest.log
      - name: Kiểm thử in / xem trước (khoảng trang, vẽ PDF, in ra tệp PDF)
        run: |
          set -o pipefail
          if dpkg -s qt6-pdf-dev >/dev/null 2>&1; then export DUNG_REQUIRE_PDF=1; fi
          QT_QPA_PLATFORM=offscreen ./build/app/dung-printtest 2>&1 | tee report/linux-printtest.log
      - name: Kiểm thử tiện ích văn bản tiếng Việt (số tiền, ngày, bảng mã cũ)
        run: |
          set -o pipefail
          ./build/app/dung-vntexttest 2>&1 | tee report/linux-vntexttest.log
      - name: Kiểm thử thư viện mẫu (thay gói cũ bằng gói mới)
        run: |
          set -o pipefail
          (cd templates && python3 -c "import shutil; shutil.make_archive('../mau-thu', 'zip', '.')")
          DUNG_TEST_ZIP="$PWD/mau-thu.zip" QT_QPA_PLATFORM=offscreen ./build/app/dung-templatetest 2>&1 | tee report/linux-templatetest.log
      - name: Toàn vẹn hiển thị/in trên thư viện mẫu thật (158 mẫu, xuất PDF)
        continue-on-error: true
        run: |
          set -o pipefail
          pip install --quiet pypdf python-docx python-pptx || true
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --templates templates --out smoke-tpl 2>&1 | tee report/linux-template-fidelity.log
          python3 tests/templates/verify_fidelity.py templates smoke-tpl 2>&1 | tee report/linux-template-fidelity-verify.log
      - name: Báo lỗi biên dịch
        if: failure()
        run: grep -E "error|Error" report/linux-build.log | head -10 | sed 's/^/::error::/' || true
      - name: Kiểm thử engine (smoke test)
        run: |
          set -o pipefail
          python3 tests/fixtures/make_fixtures.py fixtures
          # Sinh thêm .xls và .ods từ tệp mẫu để kiểm tra các định dạng Excel khác
          soffice --headless --convert-to xls --outdir fixtures fixtures/mau-doanh-thu.xlsx > /dev/null 2>&1
          soffice --headless --convert-to ods --outdir fixtures fixtures/mau-doanh-thu.xlsx > /dev/null 2>&1
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --xlsx fixtures/mau-doanh-thu.xlsx \
            --csv fixtures/mau.csv --docx fixtures/mau-van-ban.docx --pptx fixtures/mau-trinh-chieu.pptx \
            --sheet fixtures/mau-doanh-thu.xls --sheet fixtures/mau-doanh-thu.ods \
            --out smoke 2>&1 | tee report/linux-smoketest.log
      - name: Kiểm thử engine ở chế độ một luồng engine (unipoll, như trên Windows)
        run: |
          set -o pipefail
          DUNG_LOK_UNIPOLL=1 ./build/dung-smoketest --program /usr/lib/libreoffice/program --xlsx fixtures/mau-doanh-thu.xlsx \
            --csv fixtures/mau.csv --docx fixtures/mau-van-ban.docx --pptx fixtures/mau-trinh-chieu.pptx \
            --out smoke-unipoll 2>&1 | tee report/linux-smoketest-unipoll.log
      - name: Thăm dò vẽ lại sau khi gõ chữ (Writer, Calc, Impress)
        continue-on-error: true
        run: |
          set +e
          for m in "writer fixtures/mau-van-ban.docx" "calc fixtures/mau-doanh-thu.xlsx" "impress fixtures/mau-trinh-chieu.pptx"; do
            set -- $m
            timeout 120 ./build/dung-repaintprobe /usr/lib/libreoffice/program "probe-$1" "$2" "$1" 2>&1 | grep -E "^REPAINT" | tee -a report/linux-repaint.log
          done
      - name: Kiểm tra round-trip XLSX (không mất dữ liệu)
        run: |
          set -o pipefail
          python3 tests/verify_roundtrip.py fixtures/mau-doanh-thu.xlsx "$(cat smoke/saved-path.txt)" \
            --expect "Doanh thu!F2=Dũng" --expect "Doanh thu!F3==D5*2" --expect 'Doanh thu!G2=="Tổng: "&D5' \
            --known tests/known_differences.txt 2>&1 | tee report/linux-roundtrip.log
      - name: Tệp stress 5000 dòng tổng hợp — round-trip (chưa chặn, để đo mốc ban đầu)
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tests/fixtures/make_stress.py fixtures
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --roundtrip fixtures/stress-5000-dong.xlsx \
            --out smoke-stress 2>&1 | tee report/linux-stress.log
          python3 tests/verify_roundtrip.py fixtures/stress-5000-dong.xlsx "$(cat smoke-stress/saved-path.txt)" \
            --known tests/known_differences.txt 2>&1 | tee report/linux-stress-roundtrip.log
      - name: Word - kiểm thử lệnh UNO thật và định dạng DOCX sau khi lưu
        continue-on-error: true
        run: |
          set -o pipefail
          pip install --quiet python-docx || true
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --out smoke-word --word 1 2>&1 | tee report/linux-word.log
          python3 tests/word/verify_docx.py smoke-word/word-dinh-dang.docx 2>&1 | tee report/linux-word-docx.log
      - name: Phục hồi sau sập + đường dẫn dài (Linux) — kho phục hồi và engine thật
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/app/dung-recoverytest 2>&1 | tee report/linux-recoverytest.log
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --recover 1 --out smoke-recover 2>&1 | tee report/linux-recover.log
      - name: Kiểm thử ánh xạ phím/bộ gõ tiếng Việt (AltGr, thay ký tự IME)
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/app/dung-keymaptest 2>&1 | tee report/linux-keymaptest.log
      - name: Kiểm thử cập nhật (SHA-256, phiên bản, URL) và một phiên duy nhất
        run: |
          set -o pipefail
          ./build/app/dung-updatetest 2>&1 | tee report/linux-updatetest.log
      - name: PowerPoint — lệnh UNO Impress trên engine thật + kiểm tệp PPTX đã lưu
        run: |
          set -o pipefail
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --ppt fixtures/mau-trinh-chieu.pptx \
            --out smoke-ppt 2>&1 | tee report/linux-ppt.log
          python3 tests/ppt/verify_pptx.py "$(cat smoke-ppt/saved-path.txt)" 2>&1 | tee report/linux-ppt-verify.log
      - name: Kiểm thử Excel cơ bản (lệnh UNO thật) + xác minh không mất dữ liệu
        run: |
          set -o pipefail
          python3 tests/excel/make_excel_fixture.py fixtures
          python3 tests/fixtures/make_stress.py fixtures
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --xlsx fixtures/excel-co-ban.xlsx \
            --stress fixtures/stress-5000-dong.xlsx --excel 1 --out smoke-excel 2>&1 | tee report/linux-excel.log
          python3 -W ignore tests/excel/verify_excel.py smoke-excel/excel-ket-qua.xlsx \
            fixtures/stress-5000-dong.xlsx smoke-excel/stress-ket-qua.xlsx 2>&1 | tee report/linux-excel-verify.log
      - name: Ảnh chụp giao diện thật (Xvfb)
        if: always() && hashFiles('build/app/DungOffice') != ''
        run: |
          shot() { # $1 = tên ảnh, còn lại = đối số
            name=$1; shift
            xvfb-run -a -s "-screen 0 1366x820x24" bash -c "
              ./build/app/DungOffice $* > report/linux-ui-$name.log 2>&1 &
              pid=\$!; sleep 22
              import -window root report/linux-ui-$name.png
              kill -0 \$pid && echo ALIVE >> report/linux-ui-$name.log || echo DIED >> report/linux-ui-$name.log
              kill \$pid; sleep 1; kill -9 \$pid 2>/dev/null || true" || true
          }
          shot home
          shot excel fixtures/mau-doanh-thu.xlsx
          shot docx fixtures/mau-van-ban.docx
          shot pptx fixtures/mau-trinh-chieu.pptx
          shot csv fixtures/mau.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-linux
          path: report/

  # ------------------------------------------------------------------ Windows: runtime LibreOffice chính thức + MSVC + Qt
  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl python-docx python-pptx
      - name: Cài Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true
      - name: Cache engine headless
        uses: actions/cache@v4
        with:
          path: build/lo/engine
          key: engine-${{ env.ENGINE_TAG }}-${{ env.ENGINE_SHA256 }}
      - name: Tải engine headless của dự án (kiểm tra SHA-256 đã ghim)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force report | Out-Null
          if (-not (Test-Path build/lo/engine/dung-engine-headless.txt)) {
            try {
              ./scripts/fetch-engine.ps1 -Tag $env:ENGINE_TAG -Sha256 $env:ENGINE_SHA256 -OutDir build/lo *>&1 | Tee-Object report/windows-fetch.log
            } catch {
              "LỖI: $($_.Exception.Message)" | Tee-Object -Append report/windows-fetch.log
              throw
            }
          }
          Get-ChildItem build/lo/engine/program/mergedlo.dll
      - name: Tải qpdf (Apache-2.0) cho công cụ PDF
        run: |
          # Ghim phiên bản; SHA-256 được in ra để ghim vào QPDF_SHA256 (chưa lấy được băm chính thức từ nhà phát hành).
          $ver = "12.3.2"
          $zip = "qpdf-$ver-msvc64.zip"
          New-Item -ItemType Directory -Force build/qpdf-dl | Out-Null
          Invoke-WebRequest "https://github.com/qpdf/qpdf/releases/download/v$ver/$zip" -OutFile "build/qpdf-dl/$zip"
          $h = (Get-FileHash "build/qpdf-dl/$zip" -Algorithm SHA256).Hash.ToLower()
          "qpdf $zip SHA-256 = $h" | Tee-Object report/windows-qpdf.log
          if ($env:QPDF_SHA256 -and $env:QPDF_SHA256 -ne $h) { Write-Host "::error::SHA-256 qpdf không khớp"; exit 1 }
          Expand-Archive "build/qpdf-dl/$zip" -DestinationPath build/qpdf-dl/x
          $bin = Get-ChildItem build/qpdf-dl/x -Recurse -Filter qpdf.exe | Select-Object -First 1
          Copy-Item (Join-Path $bin.DirectoryName "*") -Destination (New-Item -ItemType Directory -Force build/qpdf) -Recurse
          & build/qpdf/qpdf.exe --version
      - name: Build
        run: |
          cmake -S . -B build/out -G Ninja -DCMAKE_BUILD_TYPE=Release *>&1 | Tee-Object report/windows-configure.log
          cmake --build build/out --parallel *>&1 | Tee-Object report/windows-build.log
          if ($LASTEXITCODE) {
            Select-String -Path report/windows-build.log -Pattern "error" | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }
      - name: Kiểm thử công cụ PDF (qpdf) trên Windows
        run: |
          $env:DUNG_QPDF = "$PWD/build/qpdf/qpdf.exe"
          $exe = Get-ChildItem build/out -Recurse -Filter dung-pdftest.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-pdftest.exe"; exit 1 }
          & $exe.FullName *>&1 | Tee-Object report/windows-pdftest.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Kiểm thử tiện ích bảng tính trên Windows
        run: |
          $exe = Get-ChildItem build/out -Recurse -Filter dung-tabletest.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-tabletest.exe"; exit 1 }
          & $exe.FullName *>&1 | Tee-Object report/windows-tabletest.log
      - name: Kiểm thử in / xem trước trên Windows
        run: |
          $exe = Get-ChildItem build/out -Recurse -Filter dung-printtest.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-printtest.exe"; exit 1 }
          $env:DUNG_REQUIRE_PDF = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          & $exe.FullName *>&1 | Tee-Object report/windows-printtest.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Kiểm thử tiện ích văn bản tiếng Việt trên Windows
        run: |
          $exe = Get-ChildItem build/out -Recurse -Filter dung-vntexttest.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-vntexttest.exe"; exit 1 }
          & $exe.FullName *>&1 | Tee-Object report/windows-vntexttest.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Kiểm thử thư viện mẫu trên Windows
        run: |
          $exe = Get-ChildItem build/out -Recurse -Filter dung-templatetest.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-templatetest.exe"; exit 1 }
          Compress-Archive -Path templates/* -DestinationPath mau-thu.zip -Force
          $env:DUNG_TEST_ZIP = "$PWD/mau-thu.zip"
          & $exe.FullName *>&1 | Tee-Object report/windows-templatetest.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Kiểm chứng thay phông Aptos (2 mẫu PPT) trên engine Windows
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $env:PYTHONUTF8 = "1"
          python -m pip install --quiet pypdf python-docx python-pptx
          "== Phông có trong engine ==" | Tee-Object report/windows-fonts.log
          Get-ChildItem build/lo/engine/share/fonts/truetype -ErrorAction SilentlyContinue | ForEach-Object { $_.Name } | Tee-Object -Append report/windows-fonts.log
          $src = "templates/DUNG_OFFICE_THU_VIEN_BIEU_MAU_2026/06_POWERPOINT/01_Mau_trinh_chieu_chinh_sua_duoc"
          $dst = "aptos-tpl/DUNG_OFFICE_THU_VIEN_BIEU_MAU_2026/06_POWERPOINT/01_Mau_trinh_chieu_chinh_sua_duoc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src/01_Bao_cao_van_hanh_hien_dai.pptx","$src/02_De_xuat_du_an_ky_thuat.pptx" $dst
          $p = Start-Process build/out/dung-smoketest.exe -ArgumentList @("--program", "$PWD/build/lo/engine/program", "--templates", "aptos-tpl", "--out", "$PWD/smoke-aptos") -PassThru -NoNewWindow `
                 -RedirectStandardOutput report/windows-aptos.log -RedirectStandardError report/windows-aptos.err.log
          if (-not $p.WaitForExit(10 * 60 * 1000)) { $p.Kill(); "TREO quá 10 phút" | Add-Content report/windows-aptos.log }
          Get-Content report/windows-aptos.log | Select-Object -Last 8
          "== Hồ sơ engine: bảng thay thế phông ==" | Tee-Object -Append report/windows-fonts.log
          Get-Content smoke-aptos/profile/user/registrymodifications.xcu -ErrorAction SilentlyContinue | Select-String "aptos|Substitution" | Select-Object -First 8 | Tee-Object -Append report/windows-fonts.log
          python tests/templates/inventory_fidelity.py aptos-tpl smoke-aptos windows *>&1 | Tee-Object report/windows-aptos-inventory.log
          python tests/templates/check_aptos.py aptos-tpl smoke-aptos *>&1 | Tee-Object report/windows-aptos-check.log
          # So sánh các biến thể bảng thay thế phông (mỗi biến thể một hồ sơ riêng, hồ sơ đã có mốc nên engine không ghi đè)
          python tests/templates/make_fontvariants.py fontvar
          foreach ($v in "v3","v5") {
            "== BIẾN THỂ $v ==" | Tee-Object -Append report/windows-aptos-variants.log
            $q = Start-Process build/out/dung-smoketest.exe -ArgumentList @("--program", "$PWD/build/lo/engine/program", "--templates", "aptos-tpl", "--out", "$PWD/fontvar/$v") -PassThru -NoNewWindow `
                   -RedirectStandardOutput "report/windows-aptos-$v.log" -RedirectStandardError "report/windows-aptos-$v.err.log"
            if (-not $q.WaitForExit(10 * 60 * 1000)) { $q.Kill(); "TREO" | Add-Content report/windows-aptos-variants.log }
            python tests/templates/check_aptos.py aptos-tpl "fontvar/$v" *>&1 | Tee-Object -Append report/windows-aptos-variants.log
          }
          python tests/templates/check_aptos.py aptos-tpl smoke-aptos *>&1 | Out-Null
          if ($LASTEXITCODE) { exit 1 }
      - name: Kiểm thử đầy đủ engine trên Windows (nhập liệu, lưu) — chặn job
        id: full
        # Engine headless của dự án (engine-26.8.3.1-headless) đã đạt toàn bộ bước này
        # (run 45340092506), nên đây là bước chặn.
        timeout-minutes: 15
        run: |
          $env:PYTHONUTF8 = "1"
          # Bước cài Qt có thể đổi trình Python mặc định -> cài gói kiểm thử cho đúng trình đang dùng
          python -m pip install --quiet openpyxl python-docx python-pptx
          python tests/fixtures/make_fixtures.py fixtures *>&1 | Tee-Object report/windows-fixtures.log
          if ($LASTEXITCODE) { Write-Host "::error::Không tạo được tệp mẫu"; exit 1 }
          Get-ChildItem fixtures | ForEach-Object { "$($_.Name)  $($_.Length)" } | Tee-Object -Append report/windows-fixtures.log
          $smokeArgs = @("--program", "$PWD/build/lo/engine/program", "--xlsx", "fixtures/mau-doanh-thu.xlsx",
                    "--csv", "fixtures/mau.csv", "--docx", "fixtures/mau-van-ban.docx",
                    "--pptx", "fixtures/mau-trinh-chieu.pptx", "--out", "$PWD/smoke")
          $p = Start-Process build/out/dung-smoketest.exe -ArgumentList $smokeArgs -PassThru -NoNewWindow `
                 -RedirectStandardOutput report/windows-smoketest.log -RedirectStandardError report/windows-smoketest.err.log
          # Chẩn đoán treo: sau 50 giây nếu còn chạy -> chụp màn hình + dump ngăn xếp các luồng
          if (-not $p.WaitForExit(50000)) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("report/windows-hang-screen.png")
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "$($_.ProcessName): $($_.MainWindowTitle)" } | Out-File report/windows-hang-windows.txt
            $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (Test-Path $cdb) {
              # Ký hiệu: Microsoft + máy chủ symbol chính thức của LibreOffice (bản phát hành)
              $sym = "srv*C:\sym*https://msdl.microsoft.com/download/symbols;srv*C:\sym*https://dev-downloads.libreoffice.org/symstore/symbols"
              $c = Start-Process $cdb -ArgumentList @("-p", $p.Id, "-y", "`"$sym`"", "-c", "`"~*kn 50; qd`"") -PassThru -NoNewWindow `
                     -RedirectStandardOutput report/windows-hang-stacks.txt
              if (-not $c.WaitForExit(300000)) { Stop-Process $c -Force; "cdb quá thời gian" | Add-Content report/windows-hang-stacks.txt }
            } else { "không có cdb" | Out-File report/windows-hang-stacks.txt }
          }
          $p.WaitForExit()
          $mainExit = $p.ExitCode
          "exit=$mainExit" | Add-Content report/windows-smoketest.log
          Get-Content report/windows-smoketest.log
          Get-Content report/windows-smoketest.err.log -ErrorAction SilentlyContinue | Select-Object -First 40
          if ($mainExit) { exit 1 }
      - name: Kiểm thử cơ bản engine trên Windows (mở, hiển thị) — chặn job
        timeout-minutes: 5
        run: |
          $env:PYTHONUTF8 = "1"
          $basicArgs = @("--program", "$PWD/build/lo/engine/program", "--xlsx", "fixtures/mau-doanh-thu.xlsx",
                    "--chi-mo", "1", "--out", "$PWD/smoke-co-ban")
          $p = Start-Process build/out/dung-smoketest.exe -ArgumentList $basicArgs -PassThru -NoNewWindow `
                 -RedirectStandardOutput report/windows-basic.log -RedirectStandardError report/windows-basic.err.log
          if (-not $p.WaitForExit(120000)) { Stop-Process $p -Force; "quá thời gian" | Add-Content report/windows-basic.log; exit 1 }
          Get-Content report/windows-basic.log
          if ($p.ExitCode) { exit 1 }
      - name: Thăm dò vẽ lại sau khi gõ chữ (Writer, Calc, Impress) — engine headless
        continue-on-error: true
        timeout-minutes: 8
        run: |
          $env:PYTHONUTF8 = "1"
          foreach ($m in @(@("writer","fixtures/mau-van-ban.docx"), @("calc","fixtures/mau-doanh-thu.xlsx"), @("impress","fixtures/mau-trinh-chieu.pptx"))) {
            $outf = "report/windows-repaint-$($m[0]).log"
            $p = Start-Process build/out/dung-repaintprobe.exe -PassThru -NoNewWindow `
                   -ArgumentList @("$PWD/build/lo/engine/program", "$PWD/probe-$($m[0])", "$PWD/$($m[1])", $m[0]) `
                   -RedirectStandardOutput $outf -RedirectStandardError "$outf.err"
            if (-not $p.WaitForExit(120000)) { Stop-Process $p -Force; "REPAINT $($m[0]): LỖI quá thời gian" | Add-Content $outf }
            Get-Content $outf | Select-String "^REPAINT" | ForEach-Object { $_.Line }
          }
      - name: Phục hồi sau sập + đường dẫn dài trên Windows (250-259, 262, 300 ký tự)
        run: |
          $rt = Get-ChildItem build/out -Recurse -Filter dung-recoverytest.exe | Select-Object -First 1
          if (-not $rt) { Write-Host "::error::Không thấy dung-recoverytest.exe"; exit 1 }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $rt.FullName *>&1 | Tee-Object report/windows-recoverytest.log
          if ($LASTEXITCODE) { exit 1 }
          & build/out/dung-smoketest.exe --program "$PWD/build/lo/engine/program" --recover 1 --out "$PWD/smoke-recover" *>&1 | Tee-Object report/windows-recover.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Kiểm thử ánh xạ phím/bộ gõ trên Windows
        run: |
          $exe = Get-ChildItem build/out -Recurse -Filter dung-keymaptest.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-keymaptest.exe"; exit 1 }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $exe.FullName *>&1 | Tee-Object report/windows-keymaptest.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Kiểm thử cập nhật (SHA-256, phiên bản, URL) và một phiên duy nhất trên Windows
        run: |
          $exe = Get-ChildItem build/out -Recurse -Filter dung-updatetest.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-updatetest.exe"; exit 1 }
          & $exe.FullName *>&1 | Tee-Object report/windows-updatetest.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Kiểm tra round-trip XLSX
        if: steps.full.outcome == 'success'
        run: |
          $env:PYTHONUTF8 = "1"
          $saved = Get-Content smoke/saved-path.txt -Encoding UTF8
          python tests/verify_roundtrip.py fixtures/mau-doanh-thu.xlsx "$saved" `
            --expect "Doanh thu!F2=Dũng" --expect "Doanh thu!F3==D5*2" --expect 'Doanh thu!G2=="Tổng: "&D5' `
            --known tests/known_differences.txt *>&1 | Tee-Object report/windows-roundtrip.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Đóng gói thư mục chạy được
        run: |
          ./scripts/package-windows.ps1 -BuildDir build/out -EngineDir build/lo/engine -QtDir $env:QT_ROOT_DIR -QpdfDir build/qpdf -OutDir build/dist *>&1 | Tee-Object report/windows-package.log
      - name: Ảnh chụp giao diện thật trên Windows
        if: steps.full.outcome == 'success'
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name, $argList) {
            $p = if ($argList) { Start-Process build/dist/DungOffice/DungOffice.exe -ArgumentList $argList -PassThru } `
                 else { Start-Process build/dist/DungOffice/DungOffice.exe -PassThru }
            Start-Sleep 30
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("report/windows-ui-$name.png")
            "$name : $(if ($p.HasExited) { "DIED exit=$($p.ExitCode)" } else { 'ALIVE' })" | Add-Content report/windows-ui.log
            if (-not $p.HasExited) { Stop-Process $p -Force }
            Start-Sleep 2
          }
          Shot "home" $null
          Shot "excel" "`"$PWD/fixtures/mau-doanh-thu.xlsx`""
          Shot "docx" "`"$PWD/fixtures/mau-van-ban.docx`""
          Shot "pdf" "`"$PWD/smoke/Tài liệu thử/ban-in.pdf`""
      - name: Bộ cài OneClick (Inno Setup) — chỉ khi mọi kiểm thử đã đạt
        if: success() && steps.full.outcome == 'success'
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          try { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Vietnamese.isl -OutFile installer/Vietnamese.isl } catch { Write-Host "Không tải được Vietnamese.isl, dùng tiếng Anh" }
          & $iscc /DSourceDir="$PWD\build\dist\DungOffice" /DAppVersion="0.1.0" installer/DungOffice.iss *>&1 | Tee-Object report/windows-installer.log
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem installer/Output/*.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) } | Tee-Object -Append report/windows-installer.log
      - uses: actions/upload-artifact@v4
        if: success() && steps.full.outcome == 'success'
        with:
          name: DungOffice-Setup-x64
          path: installer/Output/*.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-windows
          path: report/
      - name: Phát hành (chỉ khi gắn tag v*)
        if: startsWith(github.ref, 'refs/tags/v') && steps.full.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe

  # ------------------------------------------------------------------ Báo cáo: đẩy log + ảnh chụp lên nhánh ci-report
  report:
    if: always() && github.event_name != 'pull_request'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: report
      - name: Đẩy báo cáo lên nhánh ci-report
        run: |
          cd report
          {
            echo "# Báo cáo CI — ${GITHUB_SHA::8}"
            echo
            echo "- Linux: ${{ needs.linux.result }}"
            echo "- Windows: ${{ needs.windows.result }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > README.md
          git init -q -b ci-report
          git config user.name "dung-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI report ${GITHUB_SHA::8} (run ${{ github.run_id }})"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-report
