name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nếu điền (vd v0.1.0-test1): phát hành bản cài thử dưới tag này (pre-release nếu tag có dấu -)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LO_VERSION: "26.8.3"
  ENGINE_TAG: "engine-26.8.3.1-headless"
  ENGINE_SHA256: "03261237878855c27013ff81ba03d766fd794ff49f88d711a013747f7325cac1"
  QT_VERSION: "6.8.3"

jobs:
  # ------------------------------------------------------------------ Linux: build nhanh + kiểm thử engine + ảnh chụp UI
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cài phụ thuộc (LibreOffice của Ubuntu, Qt 6, công cụ kiểm thử)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc libreoffice-writer libreoffice-impress libreoffice-draw \
            qt6-base-dev qt6-base-private-dev libgl-dev cmake ninja-build python3-openpyxl python3-pip \
            xvfb imagemagick fonts-dejavu fonts-noto-core x11-utils qpdf
          pip3 install --break-system-packages python-docx python-pptx
          mkdir -p report
          # Qt PDF cho xem trước/in: thử cài, ghi lại kết quả (không làm hỏng cả job nếu gói không có)
          if sudo apt-get install -y --no-install-recommends qt6-pdf-dev 2>&1 | tee report/linux-qtpdf-install.log | tail -2; then :; fi
          dpkg -s qt6-pdf-dev >/dev/null 2>&1 && echo "QTPDF=có" | tee -a report/linux-qtpdf-install.log || echo "QTPDF=không" | tee -a report/linux-qtpdf-install.log
      - name: Build
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee report/linux-configure.log
          cmake --build build 2>&1 | tee report/linux-build.log
      - name: Kiểm thử công cụ PDF (qpdf)
        run: |
          set -o pipefail
          qpdf --version | head -1
          QT_QPA_PLATFORM=offscreen ./build/app/dung-pdftest 2>&1 | tee report/linux-pdftest.log
      - name: Kiểm thử tiện ích bảng tính (dòng trùng, so sánh, làm sạch)
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/app/dung-tabletest 2>&1 | tee report/linux-tabletest.log
      - name: Kiểm thử điền tên hàng loạt (docx/pptx/xlsx, CSV, tên tệp)
        run: |
          set -o pipefail
          python3 tests/fixtures/mailmerge/make_mailmerge_fixtures.py mm-fixtures
          mkdir -p mm-out
          DUNG_MM_OUT="$PWD/mm-out" QT_QPA_PLATFORM=offscreen ./build/app/dung-mailmergetest mm-fixtures 2>&1 | tee report/linux-mailmergetest.log
          ls -la mm-out | tee -a report/linux-mailmergetest.log
      - name: Xác minh độc lập tệp điền tên bằng LibreOffice
        run: |
          set -o pipefail
          bash tests/mailmerge/verify_with_lo.sh "$PWD/mm-out" "$PWD/mm-fixtures" 2>&1 | tee report/linux-mailmerge-lo.log
      - name: Kiểm thử quét tính năng sẽ mất (font nhúng, macro, SmartArt...)
        run: |
          set -o pipefail
          ./build/dung-featurescan-test tests/fixtures/features 2>&1 | tee report/linux-featurescan.log
      - name: Kiểm thử in / xem trước (khoảng trang, vẽ PDF, in ra tệp PDF)
        run: |
          set -o pipefail
          if dpkg -s qt6-pdf-dev >/dev/null 2>&1; then export DUNG_REQUIRE_PDF=1; fi
          QT_QPA_PLATFORM=offscreen ./build/app/dung-printtest 2>&1 | tee report/linux-printtest.log
      - name: Kiểm thử chụp màn hình (lõi + widget, nền offscreen)
        run: |
          set -o pipefail
          ./build/app/dung-shottest 2>&1 | tee report/linux-shottest.log
          QT_QPA_PLATFORM=offscreen ./build/app/dung-shotwidgettest 2>&1 | tee report/linux-shotwidgettest.log
      - name: Kiểm thử hệ biểu tượng (vẽ được, khác nhau, Disabled, HiDPI) + tờ tổng hợp PNG
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/app/dung-icontest report/icons 2>&1 | tee report/linux-icontest.log
          QT_QPA_PLATFORM=offscreen ./build/app/dung-ribbonicontest 2>&1 | tee report/linux-ribbonicontest.log
      - name: Kiểm thử công cụ tìm tệp (tên, nội dung, chỉ mục, đo thời gian và RAM)
        run: |
          set -o pipefail
          DUNG_FS_TEMPLATES="$PWD/templates" ./build/app/dung-filesearchtest 2>&1 | tee report/linux-filesearchtest.log
      - name: Kiểm thử tiện ích văn bản tiếng Việt (số tiền, ngày, bảng mã cũ)
        run: |
          set -o pipefail
          ./build/app/dung-vntexttest 2>&1 | tee report/linux-vntexttest.log
      - name: Kiểm thử Hộp công cụ (đăng ký, tool.json, xác nhận, chạy/dừng)
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/app/dung-toolboxtest 2>&1 | tee report/linux-toolboxtest.log
      - name: Kiểm thử công cụ tệp/thư mục/liên kết
        run: |
          set -o pipefail
          ./build/app/dung-filetest 2>&1 | tee report/linux-filetest.log
      - name: Kiểm thử kiểm tra chính tả theo âm tiết
        run: |
          set -o pipefail
          ./build/app/dung-syllabletest 2>&1 | tee report/linux-syllabletest.log
      - name: Kiểm thử thư viện mẫu (thay gói cũ bằng gói mới)
        run: |
          set -o pipefail
          (cd templates && python3 -c "import shutil; shutil.make_archive('../mau-thu', 'zip', '.')")
          DUNG_TEST_ZIP="$PWD/mau-thu.zip" QT_QPA_PLATFORM=offscreen ./build/app/dung-templatetest 2>&1 | tee report/linux-templatetest.log
      - name: Toàn vẹn hiển thị/in trên thư viện mẫu thật (158 mẫu, xuất PDF)
        continue-on-error: true
        run: |
          set -o pipefail
          pip install --quiet pypdf python-docx python-pptx || true
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --templates templates --out smoke-tpl 2>&1 | tee report/linux-template-fidelity.log
          python3 tests/templates/verify_fidelity.py templates smoke-tpl 2>&1 | tee report/linux-template-fidelity-verify.log
      - name: Báo lỗi biên dịch
        if: failure()
        run: grep -E "error|Error" report/linux-build.log | head -10 | sed 's/^/::error::/' || true
      - name: Kiểm thử engine (smoke test)
        run: |
          set -o pipefail
          python3 tests/fixtures/make_fixtures.py fixtures
          # Sinh thêm .xls và .ods từ tệp mẫu để kiểm tra các định dạng Excel khác
          soffice --headless --convert-to xls --outdir fixtures fixtures/mau-doanh-thu.xlsx > /dev/null 2>&1
          soffice --headless --convert-to ods --outdir fixtures fixtures/mau-doanh-thu.xlsx > /dev/null 2>&1
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --xlsx fixtures/mau-doanh-thu.xlsx \
            --csv fixtures/mau.csv --docx fixtures/mau-van-ban.docx --pptx fixtures/mau-trinh-chieu.pptx \
            --sheet fixtures/mau-doanh-thu.xls --sheet fixtures/mau-doanh-thu.ods \
            --out smoke 2>&1 | tee report/linux-smoketest.log
      - name: Kiểm thử engine ở chế độ một luồng engine (unipoll, như trên Windows)
        run: |
          set -o pipefail
          DUNG_LOK_UNIPOLL=1 ./build/dung-smoketest --program /usr/lib/libreoffice/program --xlsx fixtures/mau-doanh-thu.xlsx \
            --csv fixtures/mau.csv --docx fixtures/mau-van-ban.docx --pptx fixtures/mau-trinh-chieu.pptx \
            --out smoke-unipoll 2>&1 | tee report/linux-smoketest-unipoll.log
      - name: Thăm dò vẽ lại sau khi gõ chữ (Writer, Calc, Impress)
        continue-on-error: true
        run: |
          set +e
          for m in "writer fixtures/mau-van-ban.docx" "calc fixtures/mau-doanh-thu.xlsx" "impress fixtures/mau-trinh-chieu.pptx"; do
            set -- $m
            timeout 120 ./build/dung-repaintprobe /usr/lib/libreoffice/program "probe-$1" "$2" "$1" 2>&1 | grep -E "^REPAINT" | tee -a report/linux-repaint.log
          done
      - name: Đăng ký từ điển Hunspell vi cho engine — kiểm khối đăng ký (bắt buộc) + thăm dò gạch chân đỏ
        run: |
          set -o pipefail
          ./build/dung-spelldicttest 2>&1 | tee report/linux-spelldicttest.log
          python3 tests/spell/make_spell_fixture.py spellfix
          set +e
          if sudo apt-get install -y --no-install-recommends hunspell-vi 2>&1 | tail -1; then
            mkdir -p spelldict && cp /usr/share/hunspell/vi_VN.dic /usr/share/hunspell/vi_VN.aff spelldict/ 2>/dev/null
          fi
          for f in spell-good spell-bad; do
            timeout 120 ./build/dung-spellprobe /usr/lib/libreoffice/program "probe-spell-nodict-$f" "spellfix/$f.docx" 2>&1 | grep -E "^SPELL" | tee -a report/linux-spellprobe.log
            if [ -f spelldict/vi_VN.dic ]; then
              timeout 120 ./build/dung-spellprobe /usr/lib/libreoffice/program "probe-spell-dict-$f" "spellfix/$f.docx" spelldict 2>&1 | grep -E "^SPELL" | tee -a report/linux-spellprobe.log
            else
              echo "SPELL: không cài được hunspell-vi trên runner Linux — bỏ qua thăm dò có từ điển" | tee -a report/linux-spellprobe.log
            fi
          done
          exit 0
      - name: Kiểm tra round-trip XLSX (không mất dữ liệu)
        run: |
          set -o pipefail
          python3 tests/verify_roundtrip.py fixtures/mau-doanh-thu.xlsx "$(cat smoke/saved-path.txt)" \
            --expect "Doanh thu!F2=Dũng" --expect "Doanh thu!F3==D5*2" --expect 'Doanh thu!G2=="Tổng: "&D5' \
            --known tests/known_differences.txt 2>&1 | tee report/linux-roundtrip.log
      - name: Tệp stress 5000 dòng tổng hợp — round-trip (chưa chặn, để đo mốc ban đầu)
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tests/fixtures/make_stress.py fixtures
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --roundtrip fixtures/stress-5000-dong.xlsx \
            --out smoke-stress 2>&1 | tee report/linux-stress.log
          python3 tests/verify_roundtrip.py fixtures/stress-5000-dong.xlsx "$(cat smoke-stress/saved-path.txt)" \
            --known tests/known_differences.txt 2>&1 | tee report/linux-stress-roundtrip.log
      - name: Word - kiểm thử lệnh UNO thật và định dạng DOCX sau khi lưu
        continue-on-error: true
        run: |
          set -o pipefail
          pip install --quiet python-docx || true
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --out smoke-word --word 1 2>&1 | tee report/linux-word.log
          python3 tests/word/verify_docx.py smoke-word/word-dinh-dang.docx 2>&1 | tee report/linux-word-docx.log
      - name: Quét lệnh ribbon chưa được kiểm (Calc + Writer) trên engine thật (Linux)
        timeout-minutes: 5
        run: |
          set -o pipefail
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --out smoke-sweep --sweep 1 2>&1 | tee report/linux-sweep.log
      - name: Đặt lề bằng vá XML (Linux) — đơn vị, gói ZIP, .docx thật, engine thật
        run: |
          set -o pipefail
          REAL=$(find templates -name '*.docx' | sort | sed -n 1p)
          echo "tệp thật thử qua engine: $REAL"
          ./build/dung-margintest --docx-dir templates --program /usr/lib/libreoffice/program --out smoke-margin --docx "$REAL" 2>&1 | tee report/linux-margin.log
      - name: Phục hồi sau sập + đường dẫn dài (Linux) — kho phục hồi và engine thật
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/app/dung-recoverytest 2>&1 | tee report/linux-recoverytest.log
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --recover 1 --out smoke-recover 2>&1 | tee report/linux-recover.log
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --preedit 1 --out smoke-preedit 2>&1 | tee report/linux-preedit.log
      - name: Kiểm thử ánh xạ phím/bộ gõ tiếng Việt (AltGr, thay ký tự IME)
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/app/dung-keymaptest 2>&1 | tee report/linux-keymaptest.log
      - name: Kiểm thử con trỏ nhập liệu / khung ô (đơn vị + TileView thật trên engine, so điểm ảnh BẬT/TẮT)
        run: |
          set -o pipefail
          mkdir -p caret-out
          DUNG_TRACE_CARET="$PWD/caret-out/trace.log" QT_QPA_PLATFORM=offscreen ./build/app/dung-carettest --program /usr/lib/libreoffice/program --out caret-out \
            --docx fixtures/mau-van-ban.docx --xlsx fixtures/mau-doanh-thu.xlsx --pptx fixtures/mau-trinh-chieu.pptx 2>&1 | tee report/linux-carettest.log
          cp caret-out/trace.log report/linux-carettest-trace.log 2>/dev/null || true
      - name: Kiểm thử cập nhật (SHA-256, phiên bản, URL) và một phiên duy nhất
        run: |
          set -o pipefail
          ./build/app/dung-updatetest 2>&1 | tee report/linux-updatetest.log
      - name: Kiểm thử script tạo SHA256SUMS (khớp sha256sum -c, từ chối trùng tên/thiếu tệp)
        run: |
          set -o pipefail
          d=$(mktemp -d); printf 'abc' > "$d/DungOffice-Setup-0.1.0-x64.exe"; printf 'tệp thử' > "$d/Dung Office portable.zip"
          python3 scripts/make_sha256sums.py -o "$d/SHA256SUMS.txt" "$d/DungOffice-Setup-0.1.0-x64.exe" "$d/Dung Office portable.zip" | tee report/linux-sha256sums.log
          (cd "$d" && sha256sum -c SHA256SUMS.txt) | tee -a report/linux-sha256sums.log
          grep -q '^ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad  DungOffice-Setup-0.1.0-x64.exe$' "$d/SHA256SUMS.txt"
          if python3 scripts/make_sha256sums.py -o "$d/x.txt" "$d/khong-co.exe" 2>/dev/null; then echo "phải lỗi khi thiếu tệp"; exit 1; fi
          mkdir "$d/sub"; printf 'x' > "$d/sub/DungOffice-Setup-0.1.0-x64.exe"
          if python3 scripts/make_sha256sums.py -o "$d/y.txt" "$d/DungOffice-Setup-0.1.0-x64.exe" "$d/sub/DungOffice-Setup-0.1.0-x64.exe" 2>/dev/null; then echo "phải lỗi khi trùng tên"; exit 1; fi
          echo "SHA256SUMS: đạt" | tee -a report/linux-sha256sums.log
      - name: PowerPoint — lệnh UNO Impress trên engine thật + kiểm tệp PPTX đã lưu
        run: |
          set -o pipefail
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --ppt fixtures/mau-trinh-chieu.pptx \
            --out smoke-ppt 2>&1 | tee report/linux-ppt.log
          python3 tests/ppt/verify_pptx.py "$(cat smoke-ppt/saved-path.txt)" 2>&1 | tee report/linux-ppt-verify.log
      - name: Kiểm thử Excel cơ bản (lệnh UNO thật) + xác minh không mất dữ liệu
        run: |
          set -o pipefail
          python3 tests/excel/make_excel_fixture.py fixtures
          python3 tests/fixtures/make_stress.py fixtures
          ./build/dung-smoketest --program /usr/lib/libreoffice/program --xlsx fixtures/excel-co-ban.xlsx \
            --stress fixtures/stress-5000-dong.xlsx --excel 1 --out smoke-excel 2>&1 | tee report/linux-excel.log
          python3 -W ignore tests/excel/verify_excel.py smoke-excel/excel-ket-qua.xlsx \
            fixtures/stress-5000-dong.xlsx smoke-excel/stress-ket-qua.xlsx 2>&1 | tee report/linux-excel-verify.log
      - name: Chụp giao diện khung mới (offscreen, không cần engine)
        if: always() && hashFiles('build/app/DungOffice') != ''
        run: |
          mkdir -p report/ui
          DUNG_UI_SHOT_DIR="$PWD/report/ui" QT_QPA_PLATFORM=offscreen ./build/app/DungOffice 2>&1 | tee report/linux-ui-shots.log
          echo "mã thoát chế độ chụp: ${PIPESTATUS[0]} (3 = có cảnh báo chồng/cắt chữ, xem report/ui/ui-check.log)" | tee -a report/linux-ui-shots.log
          ls report/ui | head -50
      - name: Ảnh chụp giao diện thật (Xvfb)
        if: always() && hashFiles('build/app/DungOffice') != ''
        run: |
          shot() { # $1 = tên ảnh, còn lại = đối số
            name=$1; shift
            xvfb-run -a -s "-screen 0 1366x820x24" bash -c "
              ./build/app/DungOffice $* > report/linux-ui-$name.log 2>&1 &
              pid=\$!; sleep 22
              import -window root report/linux-ui-$name.png
              kill -0 \$pid && echo ALIVE >> report/linux-ui-$name.log || echo DIED >> report/linux-ui-$name.log
              kill \$pid; sleep 1; kill -9 \$pid 2>/dev/null || true" || true
          }
          shot home
          shot excel fixtures/mau-doanh-thu.xlsx
          shot docx fixtures/mau-van-ban.docx
          shot pptx fixtures/mau-trinh-chieu.pptx
          shot csv fixtures/mau.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-linux
          path: report/

  # ------------------------------------------------------------------ Windows: runtime LibreOffice chính thức + MSVC + Qt
  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl python-docx python-pptx
      - name: Cài Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true
      - name: Cache engine headless
        uses: actions/cache@v4
        with:
          path: build/lo/engine
          key: engine-${{ env.ENGINE_TAG }}-${{ env.ENGINE_SHA256 }}
      - name: Tải engine headless của dự án (kiểm tra SHA-256 đã ghim)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force report | Out-Null
          if (-not (Test-Path build/lo/engine/dung-engine-headless.txt)) {
            try {
              ./scripts/fetch-engine.ps1 -Tag $env:ENGINE_TAG -Sha256 $env:ENGINE_SHA256 -OutDir build/lo *>&1 | Tee-Object report/windows-fetch.log
            } catch {
              "LỖI: $($_.Exception.Message)" | Tee-Object -Append report/windows-fetch.log
              throw
            }
          }
          Get-ChildItem build/lo/engine/program/mergedlo.dll
      - name: Tải qpdf (Apache-2.0) cho công cụ PDF
        run: |
          # Ghim phiên bản; SHA-256 được in ra để ghim vào QPDF_SHA256 (chưa lấy được băm chính thức từ nhà phát hành).
          $ver = "12.3.2"
          $zip = "qpdf-$ver-msvc64.zip"
          New-Item -ItemType Directory -Force build/qpdf-dl | Out-Null
          Invoke-WebRequest "https://github.com/qpdf/qpdf/releases/download/v$ver/$zip" -OutFile "build/qpdf-dl/$zip"
          $h = (Get-FileHash "build/qpdf-dl/$zip" -Algorithm SHA256).Hash.ToLower()
          "qpdf $zip SHA-256 = $h" | Tee-Object report/windows-qpdf.log
          if ($env:QPDF_SHA256 -and $env:QPDF_SHA256 -ne $h) { Write-Host "::error::SHA-256 qpdf không khớp"; exit 1 }
          Expand-Archive "build/qpdf-dl/$zip" -DestinationPath build/qpdf-dl/x
          $bin = Get-ChildItem build/qpdf-dl/x -Recurse -Filter qpdf.exe | Select-Object -First 1
          Copy-Item (Join-Path $bin.DirectoryName "*") -Destination (New-Item -ItemType Directory -Force build/qpdf) -Recurse
          & build/qpdf/qpdf.exe --version
      - name: Build
        run: |
          cmake -S . -B build/out -G Ninja -DCMAKE_BUILD_TYPE=Release *>&1 | Tee-Object report/windows-configure.log
          cmake --build build/out --parallel *>&1 | Tee-Object report/windows-build.log
          if ($LASTEXITCODE) {
            Select-String -Path report/windows-build.log -Pattern "error" | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }
      - name: Kiểm thử công cụ PDF (qpdf) trên Windows
        run: |
          $env:DUNG_QPDF = "$PWD/build/qpdf/qpdf.exe"
          $exe = Get-ChildItem build/out -Recurse -Filter dung-pdftest.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-pdftest.exe"; exit 1 }
          & $exe.FullName *>&1 | Tee-Object report/windows-pdftest.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Kiểm thử tiện ích bảng tính trên Windows
        run: |
          $exe = Get-ChildItem build/out -Recurse -Filter dung-tabletest.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-tabletest.exe"; exit 1 }
          & $exe.FullName *>&1 | Tee-Object report/windows-tabletest.log
      - name: Kiểm thử quét tính năng sẽ mất trên Windows
        run: |
          $exe = Get-ChildItem build/out -Recurse -Filter dung-featurescan-test.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::Không thấy dung-featurescan-test.exe"; exit 1 }
