name: Probe Collabora snapshot (thăm dò, không phát hành)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-coda-snapshot.yml"]
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Tải bản ZIP snapshot (chỉ để thăm dò trong CI)
        shell: pwsh
        run: |
          $url = "https://www.collaboraoffice.com/downloads/Collabora-Office-Windows-Snapshot/CollaboraOffice-Winx64-26.04.6.2-138.zip"
          Invoke-WebRequest $url -OutFile coda.zip
          "{0:N0} MB" -f ((Get-Item coda.zip).Length / 1MB)
          Expand-Archive coda.zip -DestinationPath coda
      - name: Kiểm tra hàm xuất khẩu của lõi (có kiểm tra dumpbin)
        shell: pwsh
        run: |
          Write-Host "=== Tệp ở thư mục gốc ==="
          Get-ChildItem coda -File | ForEach-Object { "{0,10:N1} MB  {1}" -f ($_.Length/1MB), $_.Name }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "Không tìm thấy dumpbin" }
          Write-Host "dumpbin: $($dumpbin.FullName)"
          foreach ($name in "program\mergedlo.dll","program\sclo.dll","program\swlo.dll") {
            Write-Host "=== $name ==="
            $all = & $dumpbin.FullName /exports "coda\$name" 2>&1
            Write-Host ("tổng số dòng: " + $all.Count)
            $all | Select-String -Pattern "lok_|libreofficekit|lo_|hook" | Select-Object -First 25 | ForEach-Object { "   " + $_.Line.Trim() }
          }
          Write-Host "=== Chuỗi libreofficekit trong mergedlo.dll ==="
          $bytes = [IO.File]::ReadAllBytes("coda\program\mergedlo.dll")
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($k in "lok_init_2","libreofficekit_hook","lok_preinit","SAL_USE_VCLPLUGIN","vclplug_svp","LibreOfficeKit") {
            "{0}: {1}" -f $k, ([regex]::Matches($text, [regex]::Escape($k)).Count)
          }
